<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista previa - Clean Launcher</title>
<style>
  /* Vista previa aproximada del launcher. Pantalla base 1024x600 (horizontal),
     escalada para caber en la ventana. No muestra radio, Bluetooth ni música reales. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0b0a1f; overflow: hidden;
    font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #fff; }

  .stage { position: absolute; left: 50%; top: 50%; width: 1024px; height: 600px;
    transform-origin: center center; }

  .screen { width: 100%; height: 100%; display: flex; padding: 10px 12px 10px 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(63,169,255,.33), rgba(63,169,255,0) 55%),
      radial-gradient(circle at 95% 95%, rgba(176,76,255,.40), rgba(176,76,255,0) 55%),
      linear-gradient(135deg, #1b2c8c, #20206e 55%, #371764);
    border-radius: 14px; overflow: hidden; }

  /* Barra lateral */
  .sidebar { width: 64px; flex: none; background: rgba(0,0,0,.2); display: flex;
    flex-direction: column; align-items: center; padding: 6px 0; }
  .ring { width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid #6ea8ff; box-shadow: 0 0 12px #6ea8ff, inset 0 0 8px #6ea8ff; margin-top: 2px; }
  .side-icon { width: 56px; height: 56px; margin-top: 8px; display: flex;
    align-items: center; justify-content: center; font-size: 22px; color: #fff; opacity: .9; }

  /* Principal */
  .main { flex: 1; display: flex; flex-direction: column; padding-left: 12px; min-width: 0; }
  .status { height: 40px; display: flex; align-items: center; gap: 10px; flex: none; }
  .clock { font-size: 17px; font-weight: 700; }
  .spacer { flex: 1; }
  .temp { font-size: 15px; }
  .bt-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.15);
    display: flex; align-items: center; justify-content: center; font-size: 16px; }

  .row { display: flex; gap: 12px; min-height: 0; }
  .row1 { flex: 1; margin-top: 8px; }
  .row2 { flex: 1; margin-top: 12px; }
  .card { border-radius: 18px; background: linear-gradient(180deg, rgba(91,108,255,.30), rgba(59,63,184,.20));
    border: 1px solid rgba(127,156,255,.20); position: relative; overflow: hidden; min-width: 0; }

  /* Mapa / carro */
  .map { flex: 1.25; }
  .map .car { position: absolute; inset: 40px 30px; display: flex; align-items: center;
    justify-content: center; color: rgba(255,255,255,.35); font-size: 15px; border: 2px dashed rgba(255,255,255,.2); border-radius: 12px; }
  .chip { position: absolute; padding: 5px 12px; border-radius: 14px; background: rgba(0,0,0,.25);
    font-size: 12px; letter-spacing: .08em; }
  .map .label { top: 12px; left: 12px; }
  .map .oil { bottom: 12px; left: 12px; font-size: 13px; letter-spacing: 0; padding: 6px 14px; background: rgba(255,255,255,.15); }

  /* Radio */
  .radio { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .radio .head { font-size: 15px; color: #ffb37a; }
  .radio .freq-row { display: flex; align-items: center; width: 100%; padding: 0 12px; margin-top: 10px; }
  .btn-round { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.15);
    display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
  .freq { flex: 1; text-align: center; font-size: 50px; font-weight: 700; }
  .unit { font-size: 15px; color: rgba(255,255,255,.6); }

  /* Música */
  .music { flex: 1; background: linear-gradient(135deg, #6a3bff, #c04de8 55%, #2b1a7a); }
  .music .src { position: absolute; top: 14px; left: 14px; font-size: 12px; letter-spacing: .08em;
    background: rgba(0,0,0,.25); padding: 5px 12px; border-radius: 14px; }
  .music .info { position: absolute; left: 16px; right: 16px; bottom: 14px; }
  .music .title { font-size: 19px; font-weight: 700; }
  .music .artist { font-size: 14px; color: rgba(255,255,255,.8); margin: 2px 0 10px; }
  .controls { display: flex; justify-content: center; gap: 16px; align-items: center; }
  .ctrl { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.15);
    display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .ctrl.main { width: 60px; height: 60px; background: #fff; color: #2a1f6e; font-size: 22px; }

  /* Aplicaciones */
  .apps { flex: 1.25; padding: 12px 14px; display: flex; flex-direction: column; }
  .apps .title { font-size: 12px; letter-spacing: .08em; color: rgba(255,255,255,.7); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; margin-top: 10px; }
  .tile { border-radius: 14px; background: rgba(255,255,255,.13); display: flex;
    flex-direction: column; align-items: center; justify-content: center; font-size: 12px; }
  .tile .ico { font-size: 28px; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="screen">

    <aside class="sidebar">
      <div class="ring"></div>
      <div class="side-icon" title="Mapas">🧭</div>
      <div class="side-icon" title="Bluetooth">🔵</div>
      <div class="side-icon" title="Radio">📻</div>
      <div class="side-icon" title="Pantalla apagada">🌙</div>
      <div class="side-icon" title="Ajustes">⚙️</div>
    </aside>

    <section class="main">
      <div class="status">
        <div class="clock" id="clock">--:--</div>
        <div class="spacer"></div>
        <div class="temp">☁️ 24°</div>
        <div class="bt-btn" title="Bluetooth">🔵</div>
      </div>

      <div class="row row1">
        <div class="card map">
          <div class="chip label">NAVEGACIÓN</div>
          <div class="car">Foto del carro</div>
          <div class="chip oil">Aceite: faltan 3.200 km</div>
        </div>
        <div class="card radio">
          <div class="head">📻 RADIO FM</div>
          <div class="freq-row">
            <div class="btn-round">⏮</div>
            <div class="freq">96.0</div>
            <div class="btn-round">⏭</div>
          </div>
          <div class="unit">MHz</div>
        </div>
      </div>

      <div class="row row2">
        <div class="card music">
          <div class="src">MÚSICA</div>
          <div class="info">
            <div class="title">Nada sonando</div>
            <div class="artist">Toca para abrir la música</div>
            <div class="controls">
              <div class="ctrl">⏮</div>
              <div class="ctrl main">▶</div>
              <div class="ctrl">⏭</div>
            </div>
          </div>
        </div>
        <div class="card apps">
          <div class="title">APLICACIONES</div>
          <div class="tiles">
            <div class="tile"><div class="ico">🧭</div>Mapas</div>
            <div class="tile"><div class="ico">🔵</div>Bluetooth</div>
            <div class="tile"><div class="ico">📻</div>Radio</div>
            <div class="tile"><div class="ico">🎵</div>Música</div>
            <div class="tile"><div class="ico">🎚️</div>Ecualizador</div>
            <div class="tile"><div class="ico">➕</div>Más apps</div>
          </div>
        </div>
      </div>
    </section>

  </div>
</div>

<script>
  // Escala la pantalla de 1024x600 para que quepa en la ventana.
  function fit() {
    const s = Math.min(window.innerWidth / 1024, window.innerHeight / 600);
    document.getElementById('stage').style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  // Reloj de ejemplo.
  function tick() {
    const d = new Date();
    document.getElementById('clock').textContent =
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  window.addEventListener('resize', fit);
  fit(); tick(); setInterval(tick, 1000);
</script>
</body>
</html>
